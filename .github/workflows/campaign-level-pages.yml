name: Deploy Campaign Level

on:
  push:
    branches: [main, feature/executive-dashboard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-level-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Campaign Level
        run: npm run build:campaign-level-pages

      - name: Publish Campaign Level build
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: mmkln/Campaign-Level
          force_orphan: true
          personal_token: ${{ secrets.CAMPAIGN_LEVEL_DEPLOY_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
